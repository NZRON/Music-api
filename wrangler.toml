name = "music-api"
main = "src/index.js"
compatibility_date = "2026-11-17"
workers_dev = true
compatibility_flags = ["nodejs_compat"]

[triggers]
crons = ["* */4 * * *"]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[[kv_namespaces]]
binding = "METING_KV"
id = "bd22a94268b040e0af47f97cc10ee0ec"
